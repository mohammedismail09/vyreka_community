{% extends "admin/base_site.html" %}
{% block content %}
  <div style="max-width: 600px; padding: 20px; background: var(--body-bg); border: 1px solid var(--hairline-color); border-radius: 8px;">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button type="submit" class="default" style="padding: 10px 20px; cursor: pointer;">
          Upload All Selected Photos
        </button>
        <a href=".." style="padding: 10px 16px; border: 1px solid #ccc; border-radius: 4px; text-decoration: none;">
          Cancel
        </a>
      </div>
    </form>
  </div>
{% endblock %}
